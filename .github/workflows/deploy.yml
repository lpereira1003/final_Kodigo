name: CI/CD Docker Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare Docker env
        run: cp .env.docker.example .env

      - name: Build Docker image
        run: docker compose build

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: validate
    environment: FINALKODIGO

    steps:
      - name: Check deployment secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DO_SSH_KEY || secrets.FINALKODIGO }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || (echo "Missing secret: DO_SSH_KEY or FINALKODIGO" && exit 1)

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 138.68.11.235
          username: root
          key: ${{ secrets.DO_SSH_KEY || secrets.FINALKODIGO }}
          script: |
            set -euo pipefail
            cd /opt/mini-tienda-api
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f

      - name: Verify production health
        run: |
          for attempt in {1..12}; do
            if curl -fsS "http://138.68.11.235:3001/health"; then
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after deployment"
          exit 1
