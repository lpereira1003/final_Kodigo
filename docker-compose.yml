services:
  api:
    build:
      context: .
    container_name: mini-tienda-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
